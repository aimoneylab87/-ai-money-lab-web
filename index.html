  <!-- AI Money Lab Tracking -->
  <script>
    function trackEvent(eventName, data = {}) {
      const params = new URLSearchParams(window.location.search);

      const source = params.get("utm_source");
      const medium = params.get("utm_medium");
      const campaign = params.get("utm_campaign");
      const content = params.get("utm_content");

      let sessionId =
        sessionStorage.getItem("ai_money_lab_session");

      if (!sessionId) {
        sessionId = crypto.randomUUID();

        sessionStorage.setItem(
          "ai_money_lab_session",
          sessionId
        );
      }

      const trackingData = {
        event: eventName,
        source: source,
        medium: medium,
        campaign: campaign,
        content: content,
        landing_page: window.location.pathname,
        referrer: document.referrer,
        page_url: window.location.href,
        session_id: sessionId,
        ...data
      };

      fetch(
        "https://func-ai-money-lab.azurewebsites.net/api/track",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(trackingData)
        }
      )
      .then(response => {
        if (!response.ok) {
          throw new Error(
            `Tracking failed: ${response.status}`
          );
        }

        return response.json();
      })
      .then(result => {
        console.log(
          "AI Money Lab tracking:",
          result
        );
      })
      .catch(error => {
        console.error(
          "AI Money Lab tracking error:",
          error
        );
      });
    }

      if (!window.__aiMoneyLabPageViewTracked) {
        window.__aiMoneyLabPageViewTracked = true;
        trackEvent("page_view");
      }
  </script>
